name: Coleta

# Coleta semanal das fontes com API (BCB SGS, SICONFI e SIOP) e grava as observações em
# dados/tratados/<exercício>.json, com commit na main. Ao terminar, dispara o workflow
# "Painel" (workflow_dispatch na main), que republica a página com os dados novos.
on:
  schedule:
    - cron: "37 11 * * 1"          # segundas, 11h37 UTC (8h37 em Brasília)
  workflow_dispatch:
    inputs:
      exercicio:
        description: "Exercício a coletar"
        default: "2026"

permissions:
  contents: write
  actions: write            # disparar o workflow Painel ao final

concurrency:
  group: coleta
  cancel-in-progress: false

env:
  EXERCICIO: ${{ inputs.exercicio || '2026' }}

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: BCB (primário, DBGG, DLSP)
        run: python -m painel_fiscal coletar-bcb --exercicio "$EXERCICIO" --desde "$((EXERCICIO - 1))-01-01"
      - name: SICONFI RGF (quadrimestres publicados)
        run: python -m painel_fiscal coletar-siconfi --exercicio "$EXERCICIO" --demonstrativo rgf --periodo 1 2 3
      - name: SICONFI RREO (bimestres publicados)
        run: python -m painel_fiscal coletar-siconfi --exercicio "$EXERCICIO" --demonstrativo rreo --periodo 1 2 3 4 5 6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Instalar orcamentoBR
        run: Rscript -e 'install.packages("orcamentoBR")'
      - name: SIOP (dotação e execução por RP x GND)
        run: |
          Rscript scripts/coleta_siop.R "$EXERCICIO"
          python -m painel_fiscal coletar-siop --exercicio "$EXERCICIO"
      - name: Testes
        run: python -m pytest -q
      - name: Gravar dados coletados
        run: |
          git add dados/tratados/ dados/siop/
          if git diff --cached --quiet; then
            echo "Nenhuma observação nova."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Coleta automática: exercício $EXERCICIO ($(date -u +%Y-%m-%d))"
          git push
      # Commits do GITHUB_TOKEN não disparam "push"; workflow_dispatch é a exceção permitida.
      # Roda na main já com o commit dos dados, então o Painel publica a versão nova.
      - name: Republicar o painel
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run painel.yml --ref main --repo "$GITHUB_REPOSITORY"
