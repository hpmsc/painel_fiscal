name: Coleta — fundos

# Atualiza a base de fundos da Matriz de Indicadores: cotas diárias da CVM (universo em
# config/fundos_universo.csv), cadastro CVM, CDI do BCB, e recalcula
# dados/fundos/metricas.json. Commit na main.
# Semanal: recoleta os 2 últimos meses (a CVM republica o mês corrente e o anterior).
# Carga inicial: rodar à mão com "desde" = 2009-12 (base do retorno de 2010).
on:
  schedule:
    - cron: "17 10 * * 2"          # terças, 10h17 UTC (7h17 em Brasília)
  workflow_dispatch:
    inputs:
      desde:
        description: "Primeiro mês do informe diário (AAAA-MM). Vazio = 2 últimos meses"
        default: ""

permissions:
  contents: write

concurrency:
  group: coleta-fundos
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: CVM — informe diário
        id: cvm
        continue-on-error: true
        run: |
          DESDE="${{ inputs.desde }}"
          if [ -z "$DESDE" ]; then DESDE="$(date -u -d "$(date -u +%Y-%m-01) -1 month" +%Y-%m)"; fi
          python -m fundos coletar-cvm --desde "$DESDE"
      - name: CVM — cadastro
        id: cad
        continue-on-error: true
        run: python -m fundos cadastro-cvm
      - name: BCB — CDI
        id: cdi
        continue-on-error: true
        run: python -m fundos coletar-cdi --desde 2009-01-01
      - name: Calcular indicadores
        run: python -m fundos calcular
      - name: Testes
        run: python -m pytest -q
      - name: Gravar
        run: |
          git add dados/fundos/
          if git diff --cached --quiet; then echo "Nada novo."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Coleta fundos: $(date -u +%Y-%m-%d)"
          git push origin HEAD:main
      - name: Fontes com falha
        if: steps.cvm.outcome == 'failure' || steps.cad.outcome == 'failure' || steps.cdi.outcome == 'failure'
        run: |
          echo "::error::Coleta incompleta. CVM: ${{ steps.cvm.outcome }}; cadastro: ${{ steps.cad.outcome }}; CDI: ${{ steps.cdi.outcome }}"
          exit 1
