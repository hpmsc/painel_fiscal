# Mapeamento SICONFI → indicadores do painel.
# Confirmado contra a API real (diagnóstico de 25/09/2026, exercício 2025, RGF 3º quad. e
# RREO 6º bim.). Chaves: `cod_conta` (exato, estável entre edições do MDF); `coluna`,
# `conta` e `instituicao` são regex sem diferenciar maiúsculas; `{periodo}` na coluna vira
# o número do período; `somar: true` soma as linhas que casarem; `escala` padrão 1e-9 (R$ → R$ bi).
verificar: false

rgf:
  # RCL: Anexo 4 traz uma única linha (poder E).
  - {indicador: rcl_bi,                   anexo: "RGF-Anexo 04", cod_conta: RGF4ReceitaCorrenteLiquida, coluna: "^valor$"}
  - {indicador: operacoes_credito_rgf_bi, anexo: "RGF-Anexo 04", cod_conta: TotalConsideradoParaFinsDaApuracaoDoCumprimentoDoLimiteOperacoesDeCredito, coluna: "^valor$"}
  - {indicador: limite_operacoes_credito_senado_bi, anexo: "RGF-Anexo 04", cod_conta: LimiteGeralDefinidoPorResolucaoDoSenadoFederalParaAsOperacoesDeCreditoInternasEExternas, coluna: "^valor$"}
  - {indicador: dcl_bi,                   anexo: "RGF-Anexo 02", cod_conta: DividaConsolidadaLiquida,  coluna: "^at[eé] o {periodo}º quadrimestre"}
  - {indicador: garantias_bi,             anexo: "RGF-Anexo 03", cod_conta: TotalGarantiasConcedidas,  coluna: "^at[eé] o {periodo}º quadrimestre"}
  - {indicador: limite_garantias_senado_bi, anexo: "RGF-Anexo 03", cod_conta: LimiteDefinidoPorResolucaoDoSenadoFederal, coluna: "^at[eé] o {periodo}º quadrimestre"}

# Pessoal (RGF Anexo 1) — uma consulta por Poder (co_poder). A API devolve um bloco por
# instituição/rótulo (Executivo: União, DF, Amapá, Roraima; Legislativo: Câmara, Senado,
# TCU; Judiciário: cada tribunal; MPU: MPU e MPDFT). Somam-se a DTP e o limite oficial de
# cada bloco, o que respeita a repartição do art. 20 da LRF (inclusive os 3% do DF/territórios).
rgf_por_poder:
  E: executivo
  L: legislativo_incl_tcu
  J: judiciario
  M: mpu
rgf_pessoal:
  - {indicador: "dtp_{poder}_bi",        anexo: "RGF-Anexo 01", cod_conta: DespesaComPessoalTotal,             coluna: "^valor$", somar: true}
  - {indicador: "limite_dtp_{poder}_bi", anexo: "RGF-Anexo 01", cod_conta: LimiteMaximoDespesaComPessoalTotal, coluna: "^valor$", somar: true}

rreo:
  - {indicador: receitas_operacoes_credito_bi, anexo: "RREO-Anexo 09", cod_conta: ReceitasDeOperacoesDeCreditoRegraDeOuro, coluna: "^receitas realizadas$"}
  - {indicador: despesas_capital_bi,           anexo: "RREO-Anexo 09", cod_conta: DespesaDeCapitalLiquida,                 coluna: "^despesas empenhadas$"}
  # ⚠ Saúde e educação: a consulta com "RREO-Anexo 08" e "RREO-Anexo 12" voltou vazia para
  # a União; o nome do anexo está sendo levantado no catálogo anexos-relatorios.
