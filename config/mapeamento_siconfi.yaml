# Mapeamento SICONFI → indicadores do painel.
# ⚠ VERIFICAR TODAS AS ENTRADAS contra uma resposta real da API antes de usar:
# os rótulos de `conta` e `coluna` seguem o MDF vigente e mudam entre edições.
# `conta` e `coluna` são expressões regulares (sem diferenciar maiúsculas).
# `escala` converte R$ → R$ bilhões (padrão 1e-9).
verificar: true
rgf:
  - {indicador: rcl_bi,          anexo: "RGF-Anexo 01", conta: "RECEITA CORRENTE L[IÍ]QUIDA",        coluna: "^VALOR"}
  - {indicador: dtp_total_bi,    anexo: "RGF-Anexo 01", conta: "DESPESA TOTAL COM PESSOAL",          coluna: "^VALOR"}
  - {indicador: dcl_bi,          anexo: "RGF-Anexo 02", conta: "D[IÍ]VIDA CONSOLIDADA L[IÍ]QUIDA",   coluna: "At[eé] o \\d"}
  - {indicador: garantias_bi,    anexo: "RGF-Anexo 03", conta: "TOTAL DAS GARANTIAS CONCEDIDAS",     coluna: "At[eé] o \\d"}
  - {indicador: operacoes_credito_rgf_bi, anexo: "RGF-Anexo 04", conta: "TOTAL CONSIDERADO PARA FINS", coluna: "At[eé] o \\d"}
# Pessoal por Poder: rodar RGF Anexo 01 com co_poder = E, L, J, M e gravar como
# dtp_executivo_bi, dtp_legislativo_incl_tcu_bi, dtp_judiciario_bi, dtp_mpu_bi.
rgf_por_poder:
  E: dtp_executivo_bi
  L: dtp_legislativo_incl_tcu_bi
  J: dtp_judiciario_bi
  M: dtp_mpu_bi
rreo:
  - {indicador: receitas_operacoes_credito_bi, anexo: "RREO-Anexo 09", conta: "RECEITAS DE OPERA[CÇ][OÕ]ES DE CR[EÉ]DITO", coluna: "RECEITAS REALIZADAS"}
  - {indicador: despesas_capital_bi,           anexo: "RREO-Anexo 09", conta: "DESPESA DE CAPITAL",                         coluna: "DESPESAS (EMPENHADAS|LIQUIDADAS)"}
  - {indicador: mde_bi,                        anexo: "RREO-Anexo 08", conta: "APLICADO EM MDE",                            coluna: "Valor"}
  - {indicador: receita_liquida_impostos_bi,   anexo: "RREO-Anexo 08", conta: "RECEITA L[IÍ]QUIDA DE IMPOSTOS",             coluna: "Valor"}
  - {indicador: asps_bi,                       anexo: "RREO-Anexo 12", conta: "DESPESAS? COM A[CÇ][OÕ]ES E SERVI[CÇ]OS P[UÚ]BLICOS DE SA[UÚ]DE", coluna: "LIQUIDADAS"}
