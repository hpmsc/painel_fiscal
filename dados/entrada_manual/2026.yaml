# Entrada manual — fontes sem API. Cada observação cita a fonte.
#
# Relatório de Avaliação de Receitas e Despesas Primárias (RARDP) do 4º bimestre de 2026,
# divulgado em 24/09/2026 (MF/MPO). Valores conferidos em várias coberturas jornalísticas
# consistentes entre si (CNN Brasil, Correio Braziliense, Metrópoles, O Povo, SpaceMoney),
# porque o PDF oficial não pôde ser baixado deste ambiente. Conferir no documento oficial:
#   https://www.tesourotransparente.gov.br/publicacoes/relatorio-de-avaliacao-de-receitas-e-despesas-primarias-rardp
# Conta de fechamento: −80,9 (primário) + 67,3 (deduções) = −13,6; contingenciamento de 13,6
# leva o resultado ao piso da banda (R$ 0).
#
# Ainda NÃO preenchido (não divulgado nas fontes consultadas): limite e despesa sujeita ao
# limite por Poder (R02) e detalhamento das deduções do 4º bimestre.
exercicio: 2026
observacoes:
